<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sayfa bulunamadı | Koç Elektronik</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/png" href="/assets/logo-lacivert.png">
<style>
:root{--text:#1D1D1F;--text2:#6E6E73;--bg:#F5F5F7;--rule:#1D1D1F;--kicker:#C8102E;--btn:#0E2248;--btn-fg:#fff}
@media (prefers-color-scheme:dark){:root{--text:#F5F5F7;--text2:#A1A1A6;--bg:#000;--rule:#F5F5F7;--kicker:#FF5A5F;--btn:#F5F5F7;--btn-fg:#0E2248}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;letter-spacing:-.011em;padding:24px}
main{max-width:560px;width:100%;border-top:2px solid var(--rule);padding-top:24px}
.k{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--kicker);margin:0}
h1{font-size:clamp(32px,6vw,48px);letter-spacing:-.03em;line-height:1.1;margin:10px 0 0}
p{color:var(--text2);font-size:17px;line-height:1.5;margin:14px 0 0}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
a.btn{display:inline-flex;align-items:center;min-height:44px;padding:11px 20px;border-radius:6px;background:var(--btn);color:var(--btn-fg);text-decoration:none;font-weight:500}
a.lnk{display:inline-flex;align-items:center;min-height:44px;color:inherit}
</style>
</head>
<body>
<main>
  <p class="k">Koç Elektronik · 404</p>
  <h1>Aradığınız sayfa bulunamadı.</h1>
  <p>Bağlantı değişmiş ya da kaldırılmış olabilir. Ana sayfadan devam edebilir veya doğrudan bize ulaşabilirsiniz.</p>
  <div class="row"><a class="btn" href="/">Ana sayfaya dön</a><a class="lnk" href="tel:+905531153694">0553 115 36 94</a></div>
</main>
</body>
</html>
