<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500"><style>
.p{stroke-dasharray:9 120;stroke-dashoffset:9;animation:run 3.4s linear infinite}
@keyframes run{to{stroke-dashoffset:-120}}
.blink{animation:blink 2.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.12}}
.hot{animation:hot 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes hot{50%{opacity:.55;transform:scale(.8)}}
.smk{animation:smk 4.5s ease-out infinite;opacity:0;transform-box:fill-box;transform-origin:center}
@keyframes smk{0%{opacity:0;transform:translateY(10px) scale(.6)}25%{opacity:1}100%{opacity:0;transform:translateY(-190px) scale(1.6)}}
.spark{animation:spark 1.2s ease-out infinite;opacity:0}
@keyframes spark{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--dx),var(--dy))}}
.wv{animation:wv 3.2s linear infinite}
@keyframes wv{to{transform:translateX(-500px)}}
.cloth{animation:cloth .9s linear infinite}
@keyframes cloth{to{transform:translateY(12px)}}
.reed{animation:reed .45s ease-in-out infinite alternate}
@keyframes reed{to{transform:translateY(-10px)}}
.draw{stroke-dasharray:420;stroke-dashoffset:420;animation:draw 3.5s ease-in-out infinite}
@keyframes draw{60%,100%{stroke-dashoffset:0}}
.eq{transform-box:fill-box;transform-origin:50% 100%;animation:eq 1.1s ease-in-out infinite alternate}
@keyframes eq{0%{transform:scaleY(.35)}100%{transform:scaleY(1)}}
.lift{animation:lift 6s ease-in-out infinite}
@keyframes lift{0%,15%,85%,100%{transform:translateY(0)}45%,55%{transform:translateY(-230px)}}
.sweep{animation:sweep 4.5s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(-700px)}60%,100%{transform:translateX(900px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.p{display:none}.draw{stroke-dashoffset:0}.smk,.spark{display:none}}
</style><style>
.rip{transform-box:fill-box;transform-origin:center;animation:rip 2.6s ease-out infinite}
@keyframes rip{0%{transform:scale(.2);opacity:.9}70%,100%{transform:scale(2.2);opacity:0}}
.gauge{animation:gauge 3s ease-in-out infinite alternate}
@keyframes gauge{from{stroke-dashoffset:34}to{stroke-dashoffset:22}}
.hz{transform-box:fill-box;transform-origin:0 50%;animation:hz 2.4s ease-in-out infinite alternate}
@keyframes hz{from{transform:scaleX(.82)}to{transform:scaleX(1)}}
.fast{animation:blink .5s steps(2) infinite}
.rl{animation:rl 3.6s cubic-bezier(.45,0,.55,1) infinite}
.rr{animation:rr 3.6s cubic-bezier(.45,0,.55,1) infinite}
@keyframes rl{0%,100%{transform:translateX(0)}42%,52%{transform:translateX(330px)}}
@keyframes rr{0%,100%{transform:translateX(0)}42%,52%{transform:translateX(-330px)}}
.weft{stroke-dasharray:100 100;stroke-dashoffset:100;animation:weft 3.6s linear infinite}
@keyframes weft{0%{stroke-dashoffset:100;opacity:1}88%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.weftf{stroke-dasharray:100 100;stroke-dashoffset:100;animation:weftf 1.6s cubic-bezier(.3,.6,.4,1) infinite}
@keyframes weftf{0%{stroke-dashoffset:100;opacity:1}70%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.puff{animation:puff 1.6s ease-out infinite;opacity:0}
@keyframes puff{0%{opacity:0;transform:translateX(0)}20%{opacity:.9}100%{opacity:0;transform:translateX(90px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.weft,.weftf{stroke-dashoffset:0}.rip,.puff{display:none}}
</style><defs>
